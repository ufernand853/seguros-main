# Nginx vhost para Gestión de Seguros.
# Publica exclusivamente seguros.linsse.com y proxyfía /api al backend local en 4020.

server {
  listen 80;
  server_name seguros.linsse.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name seguros.linsse.com;

  ssl_certificate /etc/letsencrypt/live/seguros.linsse.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/seguros.linsse.com/privkey.pem;

  root /var/www/seguros-main/dist;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://127.0.0.1:4020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
