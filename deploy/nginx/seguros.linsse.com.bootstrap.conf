# Nginx bootstrap vhost para emitir el primer certificado de seguros.linsse.com.
# Usar solo antes de que exista /etc/letsencrypt/live/seguros.linsse.com/fullchain.pem.

server {
  listen 80;
  server_name seguros.linsse.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-Host $host;
  }

  root /home/adminuser/seguros-main/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
